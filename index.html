<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아마조나 분양 앵무새</title>
<meta name="description" content="행사장에 함께 온 아마조나 앵무새들의 정보와 건강 검사 기록, 분양 혜택과 브리딩센터 소개">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="KAF에서 만나는 아마조나 앵무새">
<meta property="og:description" content="행사장에 함께 온 앵무새들의 정보와 건강 검사 기록">
<meta property="og:image" content="https://raior12345.github.io/AMAZONA-26-09-KAF/images/AMZN2682.jpg">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ================================================================
     디자인 기준: 우리동네GS design.md 의 시각 처리만 차용
     - 흰 바탕 + 둥근 카드, 층은 그림자가 아니라 면 색으로 구분
     - 1차 액션 = 어두운 채움(#1E2530) + 흰 글자
     - 브랜드 색(아마조나 초록)은 버튼이 아니라 브랜드 표면(로고 배지, 원형 아이콘, 배너)에만
     - 좌우 여백 16px 하나로 통일, 터치 영역 44px 이상
     - 섹션 제목 18px / 700 / #1E2530
     - 정보는 둥근 사각 카드, 액션·아이콘·상태는 원형 또는 알약형
     ================================================================ */
  :root{
    color-scheme:light;
    --primary-dark:#1E2530;          /* 1차 버튼 배경, 섹션 제목 */
    --brand:#1f6b47;                 /* 아마조나 시그니처 표면 */
    --brand-deep:#174f35;
    --brand-soft:#e6f2eb;
    --white:#ffffff;
    --gray-50:#f4f5f7;               /* 카드 면 */
    --gray-100:#eceef2;
    --line:#e3e6eb;
    --text:#1E2530;
    --sub:#4a515d;
    --muted:#646b77;
    --mark:#ffe27a;
    --gutter:16px;
    --r-card:18px; --r-inner:12px; --r-pill:999px;
    --tabbar:64px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--white);color:var(--text);
    line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;font-variant-numeric:tabular-nums;
    padding-bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom))}
  img{max-width:100%;display:block}
  a{color:inherit}
  button{font:inherit;color:inherit}
  h1,h2,h3{text-wrap:balance;margin:0}
  p{text-wrap:pretty}
  .wrap{max-width:720px;margin:0 auto;padding:0 var(--gutter)}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
  .skip{position:absolute;left:12px;top:-60px;z-index:60;background:var(--primary-dark);color:#fff;padding:10px 14px;border-radius:var(--r-inner);font-weight:700;text-decoration:none}
  .skip:focus{top:12px}

  /* 아이콘: Phosphor(라인) SVG 를 마스크로 써서 글자색을 따름 */
  .i{display:inline-block;width:22px;height:22px;flex:none;background:currentColor;
    -webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}

  /* ---------- 상단 헤더 ---------- */
  .hd{position:sticky;top:0;z-index:20;background:rgb(255 255 255 / .96);border-bottom:1px solid transparent;transition:border-color .2s}
  .hd.scrolled{border-bottom-color:var(--line)}
  .hd .wrap{display:flex;align-items:center;gap:12px;height:56px}
  .logo-badge{flex:none;display:grid;place-items:center;height:40px;padding:0 12px;border-radius:12px;background:var(--brand)}
  .logo-badge img{height:17px;width:auto}
  .hd .title{flex:1;min-width:0}
  .hd .title b{display:block;font-size:16px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hd .title small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
  .icon-btn[hidden]{display:none}
  .icon-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:none;cursor:pointer;text-decoration:none;color:var(--text)}
  .icon-btn:active{background:var(--gray-50)}

  /* ---------- 섹션 공통 ---------- */
  .sec-title{font-size:18px;font-weight:700;color:var(--primary-dark);letter-spacing:-.01em;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title small{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
  .page-head{padding:20px 0 4px}
  .page-head h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
  .page-head p{margin:6px 0 0;color:var(--sub);font-size:15px}
  .band{height:8px;background:var(--gray-50);margin:28px calc(-1 * var(--gutter)) 0}
  .card{background:var(--gray-50);border-radius:var(--r-card);padding:18px}
  .lead{margin:0;color:var(--sub);font-size:15px}

  /* ---------- 배너 (가로 스크롤, 자동재생 없음) ---------- */
  .banners{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:12px calc(-1 * var(--gutter)) 0;padding:0 var(--gutter);scrollbar-width:none}
  .banners::-webkit-scrollbar{display:none}
  .banner{position:relative;scroll-snap-align:start;border-radius:var(--r-card);overflow:hidden;background:var(--brand);color:#fff;text-decoration:none;min-height:150px;display:flex;align-items:flex-end}
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(23 79 53 / .92) 0%,rgb(23 79 53 / .55) 60%,rgb(23 79 53 / .15))}
  .banner .txt{position:relative;z-index:1;padding:18px}
  .banner b{display:block;font-size:18px;font-weight:700;line-height:1.35;white-space:pre-line}
  .banner small{display:block;margin-top:6px;font-size:13px;opacity:.9}
  .banner .more{position:absolute;right:14px;top:14px;z-index:1;width:32px;height:32px;border-radius:50%;background:rgb(255 255 255 / .18);display:grid;place-items:center}

  /* ---------- 검색·필터 ---------- */
  .finder{position:sticky;top:56px;z-index:15;background:var(--white);padding:12px 0 10px;margin-top:8px}
  .search{display:flex;align-items:center;gap:8px;background:var(--gray-50);border-radius:var(--r-pill);padding:0 8px 0 16px;border:2px solid transparent;transition:border-color .2s}
  .search:focus-within{border-color:var(--primary-dark);background:#fff}
  .search .i{color:var(--muted);width:20px;height:20px}
  .search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;padding:12px 0}
  .search input::placeholder{color:var(--muted)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  .search .clear{border:0;background:var(--gray-100);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--sub)}
  .search .clear[hidden]{display:none}
  .search .clear .i{width:14px;height:14px;color:inherit}
  /* 밑줄 인디케이터 세그먼트 탭 (종류) */
  .seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:none;border:0;background:none;padding:10px 12px 11px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap}
  .seg button small{font-weight:500;margin-left:3px}
  .seg button[aria-pressed="true"]{color:var(--text);font-weight:700}
  .seg button[aria-pressed="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--primary-dark);border-radius:2px}
  /* 색깔 알약 */
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px calc(-1 * var(--gutter)) 0;padding:0 var(--gutter)}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:var(--r-pill);padding:0 14px;height:36px;
    font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;cursor:pointer;transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
  .chip small{color:var(--muted);font-weight:500}
  .chip[aria-pressed="true"]{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
  .chip[aria-pressed="true"] small{color:rgb(255 255 255 / .75)}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15)}

  /* ---------- 앵무새 목록 ---------- */
  .group h2{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:22px 0 10px}
  .group h2 .dot{width:12px;height:12px}
  .group h2 small{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
  .items{display:grid;gap:10px}
  @media (min-width:600px){.items{grid-template-columns:1fr 1fr}}
  .item{display:flex;gap:14px;align-items:center;background:var(--gray-50);border-radius:var(--r-card);padding:10px;text-decoration:none;transition:transform .15s var(--ease),background-color .2s}
  .item:active{transform:scale(.985);background:var(--gray-100)}
  .item .ph{flex:none;width:84px;height:84px;border-radius:var(--r-inner);overflow:hidden;position:relative;background:var(--gray-100)}
  .item .ph img{width:100%;height:100%;object-fit:cover}
  .item .info{flex:1;min-width:0}
  .item .tagno{display:block;font-size:15px;font-weight:700}
  .item .mo{font-size:13.5px;color:var(--sub);margin-top:1px}
  .item .meta{font-size:15px;font-weight:700;margin-top:2px}
  .item .go{flex:none;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--sub)}
  .item .go .i{width:16px;height:16px}
  .item.sold{opacity:.55}
  .item.sold .ph::after{content:"분양완료";position:absolute;inset:0;display:grid;place-items:center;background:rgb(30 37 48 / .6);color:#fff;font-weight:700;font-size:13px}
  mark{background:var(--mark);color:var(--text);border-radius:3px;padding:0 1px}
  .empty{text-align:center;color:var(--muted);padding:48px 16px}
  .empty button{margin-top:14px;border:0;background:var(--primary-dark);color:#fff;border-radius:var(--r-pill);height:44px;padding:0 20px;font-weight:700;cursor:pointer}

  /* ---------- 버튼 ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:var(--r-pill);border:0;text-decoration:none;
    font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s var(--ease),opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary-dark);color:#fff}
  .btn-sub{background:var(--gray-50);color:var(--text)}
  .btns{display:grid;gap:8px;margin-top:24px}

  /* ---------- 상세 ---------- */
  .hero{position:relative;background:var(--gray-100);margin:0 calc(-1 * var(--gutter))}
  .hero img{width:100%;aspect-ratio:4/3;object-fit:cover}
  .d-head{padding:18px 0 0}
  .d-head .eyebrow{font-size:14px;color:var(--brand);font-weight:700}
  .d-head h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .pill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--gray-50);font-size:13.5px;font-weight:600;color:var(--sub)}
  .price-card{display:flex;justify-content:space-between;align-items:center;background:var(--brand);color:#fff;border-radius:var(--r-card);padding:18px 20px;margin-top:16px}
  .price-card span{font-size:14px;opacity:.88}
  .price-card b{font-size:22px;letter-spacing:-.01em}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin:0}
  .kv dt{font-size:13px;color:var(--muted)}
  .kv dd{margin:2px 0 0;font-weight:700}
  .kv dd .en{font-weight:500;color:var(--muted);font-size:13px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{background:var(--brand-soft);color:var(--brand-deep);font-size:13px;font-weight:600;height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--r-pill)}
  .meter{margin:16px 0 6px}
  .meter .bar{height:8px;border-radius:var(--r-pill);background:linear-gradient(90deg,#7cc08f,#e9c25e,#d9735a);position:relative}
  .meter .pin{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--primary-dark);transform:translate(-50%,-50%)}
  .meter .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
  .note{font-size:14px;color:var(--muted);margin:8px 0 0}
  .check{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
  .check:first-child{border-top:0;padding-top:0}
  .check > div{flex:1;min-width:0}
  .check .ic{flex:none;width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .check .ic .i{width:18px;height:18px}
  .check .ic.na{background:var(--gray-100);color:var(--muted)}
  .check b{display:block}
  .check small{display:block;color:var(--muted);font-size:13.5px}
  .quote{font-size:14px;color:var(--sub);margin:8px 0 0}
  .thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .thumbs figure{margin:0}
  .thumbs button{display:block;width:100%;padding:0;border:0;background:#111;border-radius:var(--r-inner);overflow:hidden;cursor:zoom-in}
  .thumbs img{width:100%;aspect-ratio:1;object-fit:cover}
  .thumbs figcaption{font-size:13px;color:var(--muted);margin-top:5px;font-weight:600}
  .cert{display:block;margin-top:10px;width:100%;border:1px solid var(--line);border-radius:var(--r-inner);padding:0;background:#fff;cursor:zoom-in;overflow:hidden}
  .pager{display:flex;align-items:stretch;gap:8px;margin-top:12px}
  .pg{flex:1;min-width:0;background:var(--gray-50);border-radius:var(--r-inner);padding:10px 14px;text-decoration:none}
  .pg.next{text-align:right}
  .pg.off{background:none}
  .pg small{display:block;font-size:12.5px;color:var(--muted)}
  .pg b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pager .pos{align-self:center;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .disclaimer{font-size:12.5px;color:var(--muted);text-align:center;margin:20px 0 0}

  /* ---------- 분양 혜택 ---------- */
  .benefits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .benefit{background:var(--gray-50);border-radius:var(--r-card);overflow:hidden}
  .benefit img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--gray-100)}
  .benefit .t{padding:12px 14px 14px}
  .benefit b{display:block;font-size:15px}
  .benefit p{margin:4px 0 0;font-size:13.5px;color:var(--sub);line-height:1.5}
  .docs{display:flex;flex-wrap:wrap;gap:8px}
  .doc{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--brand-soft);color:var(--brand-deep);font-size:14px;font-weight:600}
  .doc .i{width:16px;height:16px}
  .steps{list-style:none;margin:0;padding:0;position:relative}
  .steps li{display:flex;gap:14px;padding-bottom:20px;position:relative}
  .steps li:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;bottom:4px;width:2px;background:var(--line)}
  .steps .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--primary-dark);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  .steps b{display:block;margin-top:6px}
  .steps p{margin:2px 0 0;font-size:14px;color:var(--sub)}

  /* ---------- 브리딩센터 ---------- */
  .gallery{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:16px calc(-1 * var(--gutter)) 0;padding:0 var(--gutter);scrollbar-width:none}
  .gallery::-webkit-scrollbar{display:none}
  .gallery figure{margin:0;scroll-snap-align:start}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-card);background:var(--gray-100)}
  .gallery figcaption{font-size:13px;color:var(--muted);margin-top:6px}
  .feats{display:grid;gap:10px}
  .feat{display:flex;gap:14px;align-items:flex-start;background:var(--gray-50);border-radius:var(--r-card);padding:16px}
  .circle{flex:none;width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
  .circle .i{width:22px;height:22px}
  .feat b{display:block;font-size:15.5px}
  .feat p{margin:4px 0 0;font-size:14px;color:var(--sub)}
  .visit{display:grid;gap:2px}
  .row-link{display:flex;align-items:center;gap:12px;min-height:56px;text-decoration:none;border-top:1px solid var(--line)}
  .row-link:first-child{border-top:0}
  .row-link .i{color:var(--brand)}
  .row-link span{flex:1}
  .row-link small{display:block;color:var(--muted);font-size:13px}
  .row-link .chev{color:var(--muted);width:16px;height:16px}

  /* ---------- 브리딩 철학 ---------- */
  .motto{background:var(--brand);color:#fff;border-radius:var(--r-card);padding:26px 22px;margin-top:16px}
  .motto b{display:block;font-size:22px;font-weight:800;letter-spacing:.01em;line-height:1.25}
  .motto p{margin:10px 0 0;font-size:15px;opacity:.92}
  .story p{margin:0 0 10px;font-size:15.5px;color:var(--sub)}
  .pillars{display:grid;gap:10px}
  .faq details{border-top:1px solid var(--line)}
  .faq details:first-child{border-top:0}
  .faq summary{display:flex;align-items:center;gap:10px;min-height:56px;font-weight:700;cursor:pointer;list-style:none}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::before{content:"Q";flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px}
  .faq summary::after{content:"";margin-left:auto;width:16px;height:16px;flex:none;background:var(--muted);
    -webkit-mask:url(https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/regular/caret-down.svg) center/contain no-repeat;
    mask:url(https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/regular/caret-down.svg) center/contain no-repeat;transition:transform .2s}
  .faq details[open] summary::after{transform:rotate(180deg)}
  .faq p{margin:0 0 16px 36px;color:var(--sub);font-size:14.5px}
  .sns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .sns a{display:grid;justify-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:600;color:var(--sub);padding:4px 0}
  .sns .circle{background:var(--gray-50);color:var(--text)}

  /* ---------- 하단 탭바 (가운데 원형 상담 버튼) ---------- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgb(255 255 255 / .98);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:var(--tabbar);padding:0 4px}
  .tab{display:grid;justify-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted)}
  .tab .i{width:24px;height:24px}
  .tab[aria-current="page"]{color:var(--text)}
  .tab[aria-current="page"] .i{color:var(--brand)}
  .fab{justify-self:center;align-self:start;margin-top:-20px;display:grid;justify-items:center;gap:3px;text-decoration:none;font-size:11.5px;font-weight:700;color:var(--text)}
  .fab .c{width:56px;height:56px;border-radius:50%;background:var(--primary-dark);color:#fff;display:grid;place-items:center;
    box-shadow:0 0 0 4px #fff, 0 8px 18px -8px rgb(30 37 48 / .6);transition:transform .15s var(--ease)}

  .lb button{position:absolute;top:14px;right:14px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--text)}

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="hd" id="hd"><div class="wrap">
  <a class="icon-btn" id="hdAction" href="#/" aria-label="앵무새 목록으로 돌아가기" hidden style="margin-left:-10px"></a>
  <a class="logo-badge" href="#/" aria-label="앵무새 목록으로"><img src="images/logo.png" alt="AMAZONA"></a>
  <div class="title"><b id="hdTitle"></b><small id="hdSub"></small></div>
</div></header>
<div id="app"></div>
<nav class="tabbar" aria-label="메뉴"><div class="wrap" id="tabbar"></div></nav>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기"><button aria-label="닫기"></button><img alt=""></div>

<script src="data.js"></script>
<script>
const $app = document.getElementById("app");
const ICON = "https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/regular/";
const icon = n => `<span class="i" style="--u:url(${ICON}${n}.svg)" aria-hidden="true"></span>`;
const won = n => n.toLocaleString("ko-KR") + "원";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = d => d.slice(2).replace(/-/g, ".");
const ageDays = d => Math.max(0, Math.floor((Date.now() - new Date(d + "T00:00:00+09:00")) / 864e5));
const sexKo = s => s === "M" ? "수컷 ♂" : s === "F" ? "암컷 ♀" : "미확인";
const tel = t => "tel:" + t.replace(/-/g, "");

// 목록 화면 상태 (상세 페이지 갔다 와도 유지)
const state = { species: "all", morph: "all", q: "", scroll: 0 };

// ---------- 공통: 헤더 · 탭바 ----------
const TABS = [
  { key: "list", href: "#/", label: "앵무새", icon: "bird" },
  { key: "benefits", href: "#/benefits", label: "분양혜택", icon: "gift" },
  { key: "fab" },
  { key: "center", href: "#/center", label: "브리딩센터", icon: "plant" },
  { key: "about", href: "#/about", label: "브리딩철학", icon: "heart-straight" },
];
function setChrome(active, title, sub, back) {
  document.getElementById("hdTitle").textContent = title;
  document.getElementById("hdSub").textContent = sub || "";
  const act = document.getElementById("hdAction");
  act.hidden = !back;
  if (back) act.innerHTML = icon("arrow-left");
  document.getElementById("tabbar").innerHTML = TABS.map(t => t.key === "fab"
    ? `<a class="fab" href="${LINKS.consult}" target="_blank" rel="noopener"><span class="c">${icon("chat-circle-dots")}</span>상담신청</a>`
    : `<a class="tab" href="${t.href}"${t.key === active ? ' aria-current="page"' : ""}>${icon(t.icon)}${t.label}</a>`).join("");
}
addEventListener("scroll", () => document.getElementById("hd").classList.toggle("scrolled", scrollY > 4), { passive: true });

// ---------- 앵무새 목록 ----------
// 번호표 끝자리: "AMZN 26 86" → "86"
const tail = b => b.no.split(" ").pop();
const norm = s => s.replace(/\s/g, "").toUpperCase();
const count = f => BIRDS.filter(f).length;

function matches(b) {
  if (state.species !== "all" && b.species !== state.species) return false;
  if (state.morph !== "all" && b.morph !== state.morph) return false;
  const q = norm(state.q);
  if (!q) return true;
  const s = SPECIES[b.species], m = MORPHS[b.morph];
  // 번호표 끝자리는 앞에서부터 맞춰 봄 ("69"가 2691에 걸리지 않게, "7"은 07도 찾음)
  const t = tail(b).toUpperCase();
  return t.startsWith(q) || t.replace(/^0+/, "").startsWith(q) || (q.length > 3 && norm(b.no).startsWith(q)) ||
    norm(m.ko + m.en + s.ko + s.en).includes(q);
}

function renderList() {
  document.title = "아마조나 분양 앵무새";
  setChrome("list", EVENT.title, EVENT.subtitle);
  $app.innerHTML = `<main class="wrap" id="main">
    <div class="banners" aria-label="아마조나 소개">
      ${INFO.banners.map(x => `<a class="banner" href="#/${x.to}">
        <img src="${x.photo}" alt="" loading="lazy">
        <span class="txt"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></span>
        <span class="more">${icon("caret-right")}</span></a>`).join("")}
    </div>
    <div class="finder">
      <label class="search">
        ${icon("magnifying-glass")}
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="번호표 번호로 찾기 (예: 86, X2)" value="${esc(state.q)}" aria-label="번호 또는 이름 검색">
        <button class="clear" id="clear" type="button" aria-label="지우기" ${state.q ? "" : "hidden"}>${icon("x")}</button>
      </label>
      <div class="seg" id="species" role="group" aria-label="종류"></div>
      <div class="chips" id="morphs" role="group" aria-label="색깔 (모프)"></div>
    </div>
    <div id="results"></div>
    <footer>ⓒ AMAZONA · 궁금한 아이를 눌러 자세한 정보를 확인하세요</footer>
  </main>`;
  const $q = document.getElementById("q"), $clear = document.getElementById("clear");
  $q.oninput = () => { state.q = $q.value; $clear.hidden = !state.q; update(); };
  $clear.onclick = () => { state.q = ""; $q.value = ""; $clear.hidden = true; update(); $q.focus(); };
  update();
  requestAnimationFrame(() => window.scrollTo(0, state.scroll));
}

// 검색창은 그대로 두고 필터와 결과만 다시 그림 (입력 중 키보드가 닫히지 않게)
function update() {
  const speciesOpts = [["all", "전체", count(() => true)],
    ...Object.entries(SPECIES).map(([k, v]) => [k, v.ko.replace(" 앵무", ""), count(b => b.species === k)])];
  const morphKeys = [...new Set(BIRDS.filter(b => state.species === "all" || b.species === state.species).map(b => b.morph))];
  if (state.morph !== "all" && !morphKeys.includes(state.morph)) state.morph = "all";

  document.getElementById("species").innerHTML = speciesOpts.map(([k, l, n]) =>
    `<button type="button" data-g="species" data-k="${k}" aria-pressed="${state.species === k}">${esc(l)}<small>${n}</small></button>`).join("");
  const chip = (key, label, n, dot) =>
    `<button type="button" class="chip" data-g="morph" data-k="${key}" aria-pressed="${state.morph === key}">${
      dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${esc(label)} <small>${n}</small></button>`;
  document.getElementById("morphs").innerHTML = chip("all", "모든 색", morphKeys.reduce((a, k) => a + count(b => b.morph === k), 0)) +
    morphKeys.map(k => chip(k, MORPHS[k].ko, count(b => b.morph === k), MORPHS[k].color)).join("");
  document.querySelectorAll(".finder [data-g]").forEach(c => c.onclick = () => { state[c.dataset.g] = c.dataset.k; update(); });

  const list = BIRDS.filter(matches);
  const $r = document.getElementById("results");
  if (!list.length) {
    $r.innerHTML = `<div class="empty">찾는 아이가 없어요.<br>번호표의 마지막 두 자리를 입력해 보세요.<br><button type="button" id="reset">전체 보기</button></div>`;
    document.getElementById("reset").onclick = () => { Object.assign(state, { species: "all", morph: "all", q: "" }); renderList(); };
    return;
  }
  const groups = [];
  list.forEach(b => {
    const key = b.species + "/" + b.morph;
    let g = groups.find(x => x.key === key);
    if (!g) groups.push(g = { key, s: SPECIES[b.species], m: MORPHS[b.morph], items: [] });
    g.items.push(b);
  });
  const q = norm(state.q);
  const hl = t => q && (t.toUpperCase().startsWith(q) || t.replace(/^0+/, "").toUpperCase().startsWith(q)) ? `<mark>${esc(t)}</mark>` : esc(t);
  $r.innerHTML = groups.map(g => `<section class="group">
    <h2><span class="dot" style="background:${g.m.color}"></span>${esc(g.m.ko)} ${esc(g.s.ko)}<small>${g.items.length}마리</small></h2>
    <div class="items">${g.items.map(b => `<a class="item${b.sold ? " sold" : ""}" href="#/${b.id}">
      <div class="ph"><img src="${b.photo}" alt="${esc(MORPHS[b.morph].ko + " " + SPECIES[b.species].ko)} 사진" loading="lazy"></div>
      <div class="info">
        <span class="tagno">${esc(b.no.slice(0, -tail(b).length))}${hl(tail(b))}</span>
        <div class="mo">${sexKo(b.sex)} · 생후 ${ageDays(b.hatch)}일</div>
        <div class="meta">${b.sold ? "분양 완료" : won(b.price)}</div>
      </div><span class="go">${icon("caret-right")}</span></a>`).join("")}</div>
  </section>`).join("");
}

// ---------- 앵무새 상세 ----------
function renderBird(b) {
  const s = SPECIES[b.species], m = MORPHS[b.morph], c = CERTS[b.cert];
  document.title = `${m.ko} ${s.ko} · ${b.no}`;
  setChrome("list", b.no, `${m.ko} ${s.ko}`, true);
  $app.innerHTML = `<main class="wrap" id="main">
    <div class="hero"><img src="${b.photo}" alt="${esc(m.ko + " " + s.ko)} 사진"></div>
    <div class="d-head">
      <div class="eyebrow">${esc(m.ko)} ${esc(m.en)}</div>
      <h1>${esc(s.ko)}</h1>
      <div class="pills"><span class="pill">${esc(b.no)}</span><span class="pill">${sexKo(b.sex)}</span><span class="pill">생후 ${ageDays(b.hatch)}일</span></div>
    </div>
    <div class="price-card"><span>${b.sold ? "이 아이는" : "분양가"}</span><b>${b.sold ? "분양 완료" : won(b.price)}</b></div>

    <h2 class="sec-title">기본 정보</h2>

      <div><dt>개체 번호</dt><dd>${esc(b.no)}</dd></div>

      <div><dt>탄생일</dt><dd>${fmtDate(b.hatch)} <span class="en">(생후 ${ageDays(b.hatch)}일)</span></dd></div>
      <div><dt>종</dt><dd>${esc(s.ko)} <span class="en">${esc(s.en)}</span></dd></div>
      <div><dt>아빠 새</dt><dd>${esc(b.dad)}</dd></div>
      <div><dt>엄마 새</dt><dd>${esc(b.mom)}</dd></div>
    </dl></div>

    <h2 class="sec-title"><span class="dot" style="background:${m.color}"></span>모프 · ${esc(m.ko)}</h2>
    <div class="card"><p class="lead">${esc(m.desc)}</p></div>

    <h2 class="sec-title">${esc(s.ko)}는 어떤 새인가요?</h2>
    <div class="card">
      <div class="tags"><span class="tag">수명 ${esc(s.lifespan)}</span><span class="tag">${esc(s.size)} 앵무</span></div>
      <p class="lead">${esc(s.feature)}</p>
      <div class="meter" aria-label="소음 수준">
        <div class="bar"><span class="pin" style="left:${s.noise}%"></span></div>
        <div class="lbl"><span>조용함</span><span>소음</span><span>시끄러움</span></div>
      </div>
      <p class="note">${esc(s.noiseNote)}</p>
    </div>

    <h2 class="sec-title">건강 검사 결과</h2>
    <div class="card">
      <div class="check"><span class="ic">${icon("check-circle")}</span><div>
        <b>PDD · PBFD · 앵무병 음성</b>
        <small>경기도(북부) 동물위생시험소 유전자 검사(RT-PCR) · 병원체 불검출 (${c.date})</small>
        <button class="cert" data-zoom="${c.img}" aria-label="검사 성적서 크게 보기"><img src="${c.img}" alt="동물위생시험소 검사 성적서" loading="lazy"></button>
        <small style="margin-top:6px">성적서의 개체 번호 목록에서 <b style="display:inline">${esc(tail(b))}</b>번을 확인할 수 있어요</small>
      </div></div>
      ${b.xray ? `<div class="check"><span class="ic">${icon("check-circle")}</span><div>
        <b>X-RAY 이상 없음 소견</b>
        <small>${esc(XRAY_HOSPITAL.name)} · ${esc(XRAY_HOSPITAL.address)}</small>
        <p class="quote">“${esc(XRAY_OPINION)}”</p>
        <div class="thumbs">${b.xray.map((src, i) => `<figure><button data-zoom="${src}" aria-label="X-RAY 사진#${i + 1} 크게 보기"><img src="${src}" alt="${esc(b.no)} X-RAY 사진 ${i + 1}" loading="lazy"></button><figcaption>사진#${i + 1}</figcaption></figure>`).join("")}</div>
      </div></div>` : `<div class="check"><span class="ic na" aria-hidden="true">-</span><div><b>X-RAY / CT</b><small>미실시</small></div></div>`}
    </div>

    <div class="btns">
      <a class="btn btn-primary" href="${LINKS.consult}" target="_blank" rel="noopener">${icon("chat-circle-dots")}분양 상담 신청</a>
      <a class="btn btn-sub" href="${LINKS.kakao}" target="_blank" rel="noopener">카카오톡으로 문의하기</a>
    </div>
    ${pager(b)}
    <p class="disclaimer">오진이 발생한 경우 병원 측의 책임이 없음을 알려드리며, 계약서의 보상 항목에 의거<br>치명적 질병 혹은 장애의 경우 당사(아마조나)에서 책임 및 보상을 진행합니다.</p>
  </main>`;
  $app.querySelectorAll("[data-zoom]").forEach(el => el.onclick = () => openLb(el.dataset.zoom));
}

// 이전/다음 아이 (목록에서 고른 필터 기준)
function pager(b) {
  let list = BIRDS.filter(matches);
  if (!list.includes(b)) list = BIRDS;
  const i = list.indexOf(b), prev = list[i - 1], next = list[i + 1];
  const link = (x, dir) => x
    ? `<a class="pg ${dir}" href="#/${x.id}"><small>${dir === "prev" ? "이전" : "다음"}</small><b>${esc(MORPHS[x.morph].ko)} · ${esc(tail(x))}</b></a>`
    : `<span class="pg ${dir} off"></span>`;
  return `<nav class="pager" aria-label="다른 아이 보기">${link(prev, "prev")}<span class="pos">${i + 1} / ${list.length}</span>${link(next, "next")}</nav>`;
}

// ---------- 분양 혜택 ----------

    <div class="btns">
      <a class="btn btn-primary" href="${LINKS.consult}" target="_blank" rel="noopener">${icon("chat-circle-dots")}분양 상담 신청</a>

function renderAbout() {

  document.title = "브리딩 철학 · 아마조나";
  setChrome("about", "브리딩 철학", "아마조나가 앵무새를 키우는 방식");
  $app.innerHTML = `<main class="wrap" id="main">

    <div class="story" style="margin-top:20px">${A.story.map(p => `<p>${esc(p)}</p>`).join("")}</div>

    <div class="pillars">${A.pillars.map(f => `<div class="feat"><span class="circle">${icon(f.icon)}</span><div><b>${esc(f.title)}</b><p>${esc(f.body)}</p></div></div>`).join("")}</div>
    <div class="band"></div>

    <div class="band"></div>

const lb = document.getElementById("lb");
lb.querySelector("button").innerHTML = icon("x");
function openLb(src) { lb.querySelector("img").src = src; lb.classList.add("on"); }
lb.onclick = () => lb.classList.remove("on");
document.addEventListener("keydown", e => e.key === "Escape" && lb.classList.remove("on"));

// ---------- 주소별 화면: #/ 목록, #/AMZN2686 상세, #/benefits #/center #/about ----------
const PAGES = { benefits: renderBenefits, center: renderCenter, about: renderAbout };
let onList = false;
function route() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const id = raw.replace(/\s/g, "").toUpperCase();
  const bird = BIRDS.find(b => b.id === id);
  if (onList) state.scroll = window.scrollY; // 목록 스크롤 위치 기억
  onList = !bird && !PAGES[raw];
  if (bird) { renderBird(bird); window.scrollTo(0, 0); }
  else if (PAGES[raw]) { PAGES[raw](); window.scrollTo(0, 0); }
  else renderList();
}
addEventListener("hashchange", route);
route();
</script>
